plugins { id 'java' }
group = 'mc.bastion'
version = '1.0.6'
repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' }; maven { url = 'https://jitpack.io' }; maven { url = 'https://maven.enginehub.org/repo/' } }
dependencies { compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'; compileOnly('com.github.MilkBowl:VaultAPI:1.7') { transitive = false }; compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.14' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
